<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>SOC Toolkit</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

/* Top bar */
#topbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
#topbar .brand { font-weight: 700; color: #f8fafc; white-space: nowrap; margin-right: 8px; }
#search-input { flex: 1; max-width: 260px; padding: 6px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-size: 13px; }
#search-input::placeholder { color: #475569; }
.date-input { width: 110px; padding: 6px 8px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-size: 13px; }
.sep { color: #475569; font-size: 13px; }
.btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn-primary { background: #1e40af; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-secondary { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; }
.btn-secondary:hover { background: #334155; }
.btn-danger { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
.btn-danger:hover { background: #7f1d1d; }
.btn-success { background: #064e3b; color: #6ee7b7; border: none; }
.btn-success:hover { background: #065f46; }
.btn-sm { padding: 3px 8px; font-size: 14px; }

/* Layout */
#layout { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
#sidebar { width: 150px; background: #0f172a; border-right: 1px solid #1e293b; overflow: hidden; flex-shrink: 0; transition: width 0.2s ease; }
#sidebar.collapsed { width: 32px; }
#sidebar.disabled .sidebar-inner { opacity: 0.4; pointer-events: none; }
#sidebar-toggle { width: 100%; background: none; border: none; border-bottom: 1px solid #1e293b; color: #475569; cursor: pointer; padding: 8px 0; font-size: 14px; text-align: center; }
#sidebar-toggle:hover { color: #e2e8f0; background: #1e293b; }
.sidebar-inner { padding: 12px 8px; white-space: nowrap; overflow-y: auto; max-height: calc(100vh - 40px); }
#sidebar .sidebar-label { font-size: 13px; text-transform: uppercase; color: #475569; padding: 0 6px; margin-bottom: 8px; letter-spacing: 0.05em; }
.date-item { padding: 7px 8px; border-radius: 4px; font-size: 15px; cursor: pointer; color: #94a3b8; margin-bottom: 2px; }
.date-item:hover { background: #1e293b; color: #e2e8f0; }
.date-item.active { background: #1e40af; color: #fff; }

/* Main */
#main { flex: 1; overflow-y: auto; padding: 20px; }
#main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; position: sticky; top: 0; z-index: 10; background: #0f172a; padding: 10px 0; }
#main-title { font-size: 16px; color: #94a3b8; }
#main-actions { display: flex; gap: 8px; }

/* Report card */
.report-card { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 14px; margin-bottom: 10px; }
.report-card.editing { border-color: #3b82f6; }
.report-fields { display: grid; grid-template-columns: 140px 1fr; gap: 4px 8px; font-size: 15px; margin-bottom: 10px; }
.field-label { color: #64748b; }
.field-value { color: #e2e8f0; }
.field-input { width: 100%; padding: 4px 8px; background: #0f172a; border: 1px solid #334155; border-radius: 3px; color: #e2e8f0; font-size: 15px; }
.card-actions { display: flex; gap: 6px; }
.edit-label { font-size: 13px; color: #3b82f6; margin-bottom: 8px; }

/* Search results */
.search-date-tag { font-size: 13px; color: #3b82f6; margin-bottom: 4px; }
#no-results { text-align: center; color: #475569; padding: 40px; }
/* Toast */
#toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; pointer-events: none; }
.toast { padding: 10px 16px; border-radius: 4px; font-size: 15px; opacity: 1; transition: opacity 0.3s ease; white-space: nowrap; }
.toast-success { background: #065f46; color: #6ee7b7; border: 1px solid #10b981; }
.toast-error { background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; }
.report-checkbox { width: 14px; height: 14px; cursor: pointer; accent-color: #3b82f6; }
.checkbox-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.checkbox-row label { font-size: 12px; color: #64748b; cursor: pointer; }
/* Drawer overlay */
#drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.25s ease;
}
#drawer-overlay.open { opacity: 1; }

/* Schema drawer */
#schema-drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 38%;
  max-width: 50%;
  min-width: 280px;
  background: #1e293b;
  border-left: 1px solid #334155;
  z-index: 101;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  overflow: hidden;
}
#schema-drawer.open { transform: translateX(0); }
#schema-drawer-header {
  padding: 14px 16px;
  font-size: 15px;
  font-weight: 600;
  color: #94a3b8;
  border-bottom: 1px solid #334155;
  flex-shrink: 0;
}
#schema-drawer-content {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
}
#schema-drawer-footer {
  padding: 12px 16px;
  border-top: 1px solid #334155;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <span class="brand">SOC Toolkit</span>
  <input id="search-input" type="text" placeholder="搜尋 IP / Offense ID...">
  <span class="sep">日期區間</span>
  <input id="date-from" class="date-input" type="date">
  <span class="sep">～</span>
  <input id="date-to" class="date-input" type="date">
  <button class="btn btn-primary" onclick="doSearch()">搜尋</button>
  <button id="clear-search-btn" class="btn btn-secondary" style="display:none" onclick="clearSearch()">✕ 清除</button>
</div>

<div id="layout">
  <!-- Sidebar -->
  <div id="sidebar">
    <button id="sidebar-toggle" onclick="toggleSidebar()">‹</button>
    <div class="sidebar-inner">
      <div class="sidebar-label">日期</div>
      <div id="date-list"></div>
    </div>
  </div>

  <!-- Main content -->
  <div id="main">
    <div id="main-header">
      <span id="main-title">載入中...</span>
      <div id="main-actions">
        <button class="btn btn-primary btn-sm" onclick="openAddForm()">＋ 新增通報</button>
        <button id="select-all-btn" class="btn btn-secondary btn-sm" onclick="toggleSelectAll()">全選</button>
        <button id="copy-selected-btn" class="btn btn-success btn-sm" onclick="copySelected()" disabled>複製選取事件</button>
        <button class="btn btn-secondary btn-sm" onclick="openSchemaDrawer()">欄位管理</button>
      </div>
    </div>
    <div id="add-form-container" style="display:none"></div>
    <div id="reports-container"></div>
  </div>
</div>

<script>
let currentDate = null;
let currentReports = [];
let schemaFields = [];
let isSearchMode = false;

const today = new Date().toISOString().split('T')[0];

function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) {
    let msg;
    try {
      const err = await r.json();
      msg = err.detail || JSON.stringify(err);
    } catch {
      msg = await r.text();
    }
    throw new Error(msg);
  }
  return r.json();
}

async function loadDates() {
  const dates = await api('GET', '/api/dates');
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  if (!dates.includes(today)) {
    const item = document.createElement('div');
    item.className = 'date-item' + (currentDate === today ? ' active' : '');
    item.textContent = today + ' ●';
    item.onclick = () => selectDate(today);
    list.appendChild(item);
  }
  dates.forEach(d => {
    const item = document.createElement('div');
    item.className = 'date-item' + (currentDate === d ? ' active' : '');
    item.textContent = d;
    item.onclick = () => selectDate(d);
    list.appendChild(item);
  });
}

async function selectDate(date) {
  currentDate = date;
  isSearchMode = false;
  document.getElementById('sidebar').classList.remove('disabled');
  document.getElementById('clear-search-btn').style.display = 'none';
  document.getElementById('select-all-btn').style.display = '';
  document.getElementById('copy-selected-btn').style.display = '';
  await loadDates();
  const reports = await api('GET', `/api/reports?date=${date}`);
  currentReports = reports;
  document.getElementById('main-title').textContent = `${date}　${reports.length} 筆通報`;
  renderReports(reports);
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  const dateFrom = document.getElementById('date-from').value;
  const dateTo = document.getElementById('date-to').value;

  if (!q && !dateFrom && !dateTo) {
    showToast('請輸入搜尋條件', 'error');
    return;
  }

  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (dateFrom) params.set('date_from', dateFrom);
  if (dateTo) params.set('date_to', dateTo);

  const data = await api('GET', `/api/search?${params}`);
  isSearchMode = true;
  document.getElementById('sidebar').classList.add('disabled');
  document.getElementById('clear-search-btn').style.display = '';
  document.getElementById('select-all-btn').style.display = 'none';
  document.getElementById('copy-selected-btn').style.display = 'none';
  const label = q ? `搜尋「${q}」` : '日期區間搜尋';
  document.getElementById('main-title').textContent = `${label} — ${data.reports.length} 筆結果`;
  renderReports(data.reports, true);
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('date-from').value = '';
  document.getElementById('date-to').value = '';
  selectDate(currentDate);
}

function openSchemaDrawer() {
  renderSchemaPanel();
  const overlay = document.getElementById('drawer-overlay');
  const drawer = document.getElementById('schema-drawer');
  overlay.style.display = 'block';
  requestAnimationFrame(() => {
    overlay.classList.add('open');
    drawer.classList.add('open');
  });
}

function closeSchemaDrawer() {
  const overlay = document.getElementById('drawer-overlay');
  const drawer = document.getElementById('schema-drawer');
  overlay.classList.remove('open');
  drawer.classList.remove('open');
  drawer.addEventListener('transitionend', () => {
    if (!drawer.classList.contains('open')) overlay.style.display = 'none';
  }, { once: true });
}

function renderSchemaPanel() {
  const panel = document.getElementById('schema-drawer-content');
  const rows = schemaFields.map((f, i) => `
    <div class="schema-row" data-index="${i}" style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <input class="field-input" value="${f}" style="flex:1" oninput="schemaFields[${i}]=this.value">
      <button class="btn btn-secondary btn-sm" onclick="schemaRowUp(${i})">↑</button>
      <button class="btn btn-danger btn-sm" onclick="schemaFields.splice(${i},1);renderSchemaPanel()">✕</button>
    </div>`).join('');
  panel.innerHTML = `
    <div id="schema-rows">${rows}</div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="new-field-input" class="field-input" placeholder="新欄位名稱" style="flex:1">
      <button class="btn btn-success btn-sm" onclick="addSchemaField()">＋ 新增</button>
    </div>`;
}

function schemaRowUp(i) {
  if (i === 0) return;
  [schemaFields[i-1], schemaFields[i]] = [schemaFields[i], schemaFields[i-1]];
  renderSchemaPanel();
}

function addSchemaField() {
  const input = document.getElementById('new-field-input');
  const val = input.value.trim();
  if (!val) return;
  schemaFields.push(val);
  input.value = '';
  renderSchemaPanel();
}

async function saveSchema() {
  try {
    await api('PUT', '/api/schema', { fields: schemaFields });
    closeSchemaDrawer();
  } catch (e) {
    showToast(`儲存失敗：${e.message}`, 'error');
  }
}

async function init() {
  schemaFields = (await api('GET', '/api/schema')).fields;
  await loadDates();
  await selectDate(today);
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });
}

function renderReports(reports, searchMode = false) {
  const container = document.getElementById('reports-container');
  container.innerHTML = '';
  document.getElementById('add-form-container').style.display = 'none';
  const copyBtn = document.getElementById('copy-selected-btn');
  if (copyBtn) copyBtn.disabled = true;
  if (reports.length === 0) {
    container.innerHTML = '<div id="no-results">無通報紀錄</div>';
    return;
  }
  reports.forEach(r => container.appendChild(buildCard(r, searchMode)));
}

function buildCard(report, showDate = false) {
  const card = document.createElement('div');
  card.className = 'report-card';
  card.id = `card-${report.id}`;

  let html = '';
  if (!showDate) {
    html += `<div class="checkbox-row">
      <input type="checkbox" class="report-checkbox" id="chk-${report.id}" data-id="${report.id}" onchange="updateCopyBtn()">
      <label for="chk-${report.id}">選取</label>
    </div>`;
  }
  if (showDate) html += `<div class="search-date-tag">${report.date}</div>`;
  html += '<div class="report-fields">';
  report.field_order.forEach(k => {
    html += `<span class="field-label">${k}</span><span class="field-value">${report.fields[k] ?? ''}</span>`;
  });
  html += '</div>';
  html += `<div class="card-actions">
    <button class="btn btn-secondary btn-sm" onclick="copyReport(${report.id})">複製</button>
    <button class="btn btn-secondary btn-sm" onclick="editReport(${report.id})">編輯</button>
    <button class="btn btn-danger btn-sm" onclick="deleteReport(${report.id})">刪除</button>
  </div>`;
  card.innerHTML = html;
  card._report = report;
  return card;
}

function formatReport(report) {
  return report.field_order.map(k => `- ${k}：${report.fields[k] ?? ''}`).join('\n');
}

async function copyReport(id) {
  const card = document.getElementById(`card-${id}`);
  await navigator.clipboard.writeText(formatReport(card._report));
  showToast('已成功複製');
}

function updateCopyBtn() {
  const any = document.querySelectorAll('.report-checkbox:checked').length > 0;
  document.getElementById('copy-selected-btn').disabled = !any;
}

function toggleSelectAll() {
  const checkboxes = Array.from(document.querySelectorAll('.report-checkbox'));
  const allChecked = checkboxes.length > 0 && checkboxes.every(cb => cb.checked);
  checkboxes.forEach(cb => { cb.checked = !allChecked; });
  updateCopyBtn();
}

async function copySelected() {
  const checked = Array.from(document.querySelectorAll('.report-checkbox:checked'));
  if (!checked.length) return;
  const ids = new Set(checked.map(cb => parseInt(cb.dataset.id)));
  const reports = currentReports.filter(r => ids.has(r.id));
  const text = reports.map(r => formatReport(r)).join('\n\n\n');
  await navigator.clipboard.writeText(text);
  showToast('已成功複製');
}

async function deleteReport(id) {
  if (!confirm('確定要刪除這筆通報嗎？')) return;
  await api('DELETE', `/api/reports/${id}`);
  await selectDate(currentDate);
}

function buildFieldRows(fields, order, defaultKeys = []) {
  return order.map((k, i) => {
    const isDefault = defaultKeys.includes(k);
    if (isDefault) {
      return `
        <div class="field-row" data-key="${k}">
          <button class="btn btn-danger btn-sm" onclick="deleteFieldRow(this)">✕</button>
          <span class="drag-handle" draggable="true">⠿</span>
          <span class="key-label">${k}</span>
          <input class="field-input val-input" value="${fields[k] ?? ''}" placeholder="值">
        </div>`;
    }
    return `
      <div class="field-row" data-key="${k}">
        <button class="btn btn-danger btn-sm" onclick="deleteFieldRow(this)">✕</button>
        <span class="drag-handle" draggable="true">⠿</span>
        <input class="field-input key-input" value="${k}" placeholder="欄位名稱">
        <input class="field-input val-input" value="${fields[k] ?? ''}" placeholder="值">
      </div>`;
  }).join('');
}

function addFieldRow(container) {
  const row = document.createElement('div');
  row.className = 'field-row';
  row.innerHTML = `
    <button class="btn btn-danger btn-sm" onclick="deleteFieldRow(this)">✕</button>
    <span class="drag-handle" draggable="true">⠿</span>
    <input class="field-input key-input" placeholder="欄位名稱">
    <input class="field-input val-input" placeholder="值">`;
  container.querySelector('.field-rows').appendChild(row);
  bindDrag(container);
}


function collectFormData(container) {
  const rows = container.querySelectorAll('.field-row');
  const fields = {}, order = [];
  rows.forEach(r => {
    const keyInput = r.querySelector('.key-input');
    const keyLabel = r.querySelector('.key-label');
    const k = keyInput ? keyInput.value.trim() : (keyLabel ? keyLabel.textContent.trim() : '');
    const v = r.querySelector('.val-input').value.trim();
    if (k) { fields[k] = v; order.push(k); }
  });
  return { fields, field_order: order };
}

function updatePreview(container) {
  const { fields, field_order } = collectFormData(container);
  const preview = container.querySelector('.preview-area');
  preview.textContent = field_order.map(k => `- ${k}：${fields[k] ?? ''}`).join('\n');
}

function deleteFieldRow(btn) {
  const fc = btn.closest('.form-container');
  btn.closest('.field-row').remove();
  updatePreview(fc);
}

function bindDrag(container) {
  const rows = container.querySelectorAll('.field-row');
  rows.forEach(row => {
    row.querySelector('.drag-handle').ondragstart = e => {
      e.dataTransfer.effectAllowed = 'move';
      container._dragging = row;
    };
    row.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
    row.ondrop = e => {
      e.preventDefault();
      const dragging = container._dragging;
      if (dragging && dragging !== row) {
        row.parentNode.insertBefore(dragging, row);
        updatePreview(container);
      }
    };
  });
}

function buildForm(fields, order, onSave, onCancel, defaultKeys = []) {
  const div = document.createElement('div');
  div.className = 'form-container report-card';
  div.innerHTML = `
    <style>
      .field-row { display: grid; grid-template-columns: 32px 20px 1fr 3fr; gap: 6px; align-items: center; margin-bottom: 6px; }
      .key-label { font-size: 15px; color: #cbd5e1; padding: 4px 8px; }
      .drag-handle { cursor: grab; color: #475569; text-align: center; user-select: none; }
      .preview-area { background: #0f172a; border: 1px solid #334155; border-radius: 4px; padding: 10px; font-size: 14px; color: #94a3b8; white-space: pre; margin-bottom: 12px; min-height: 40px; }
      .form-container .form-label { font-size: 13px; color: #475569; margin-bottom: 4px; text-transform: uppercase; }
    </style>
    <div class="field-rows">${buildFieldRows(fields, order, defaultKeys)}</div>
    <button class="btn btn-success btn-sm" style="margin-bottom:12px" onclick="addFieldRow(this.closest('.form-container'))">＋ 新增欄位</button>
    <div class="form-label">輸出預覽</div>
    <div class="preview-area"></div>
    <div class="card-actions">
      <button class="btn btn-primary btn-sm save-btn">儲存</button>
      <button class="btn btn-secondary btn-sm cancel-btn">取消</button>
    </div>`;
  div.querySelector('.save-btn').onclick = () => onSave(div);
  div.querySelector('.cancel-btn').onclick = onCancel;
  bindDrag(div);
  updatePreview(div);
  div.querySelectorAll('.field-input').forEach(i => i.addEventListener('input', () => updatePreview(div)));
  return div;
}

function cancelForm() {
  document.getElementById('add-form-container').style.display = 'none';
  document.getElementById('add-form-container').innerHTML = '';
}

function openAddForm() {
  const container = document.getElementById('add-form-container');
  container.style.display = 'block';
  container.innerHTML = '';
  const now = new Date();
  const dateStr = `${now.getMonth() + 1}月${now.getDate()}日`;
  const initFields = Object.fromEntries(
    schemaFields.map(k => [k, k === '時間' ? dateStr : ''])
  );
  const form = buildForm(
    initFields,
    schemaFields,
    async (div) => {
      const { fields, field_order } = collectFormData(div);
      try {
        await api('POST', '/api/reports', { date: currentDate, fields, field_order });
        showToast('已成功儲存');
        await selectDate(currentDate);
      } catch (e) {
        showToast(`儲存失敗：${e.message}`, 'error');
      }
    },
    cancelForm,
    schemaFields
  );
  container.appendChild(form);
}

function editReport(id) {
  const card = document.getElementById(`card-${id}`);
  const report = card._report;
  card.classList.add('editing');
  card.innerHTML = '<div class="edit-label">編輯中</div>';
  const form = buildForm(
    report.fields,
    report.field_order,
    async (div) => {
      const { fields, field_order } = collectFormData(div);
      try {
        await api('PUT', `/api/reports/${id}`, { fields, field_order });
        showToast('已成功儲存');
        await selectDate(currentDate);
      } catch (e) {
        showToast(`儲存失敗：${e.message}`, 'error');
      }
    },
    async () => { await selectDate(currentDate); }
  );
  card.appendChild(form);
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
  document.getElementById('sidebar-toggle').textContent =
    sidebar.classList.contains('collapsed') ? '›' : '‹';
}

init();
</script>
<div id="drawer-overlay" onclick="closeSchemaDrawer()"></div>
<div id="schema-drawer">
  <div id="schema-drawer-header">預設欄位管理</div>
  <div id="schema-drawer-content"></div>
  <div id="schema-drawer-footer">
