<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>SOC Toolkit</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

/* Top bar */
#topbar { background: #1e293b; border-bottom: 1px solid #334155; padding: 14.5px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
#topbar .brand { font-weight: 700; font-size: 20px; color: #f8fafc; white-space: nowrap; margin-right: 24px; }
#search-input { flex: 1; max-width: 260px; padding: 6px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-size: 13px; }
#search-input::placeholder { color: #475569; }
.date-input { width: 110px; padding: 6px 8px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-size: 13px; }
.sep { color: #475569; font-size: 13px; }
.btn { padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn-primary { background: #1e40af; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-secondary { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; }
.btn-secondary:hover { background: #334155; }
.btn-danger { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
.btn-danger:hover { background: #7f1d1d; }
.btn-success { background: #064e3b; color: #6ee7b7; border: none; }
.btn-success:hover { background: #065f46; }
.btn-sm { padding: 8px 16px; font-size: 16px; }

/* Layout */
#reports-tab { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#layout { display: flex; flex: 1; min-height: 0; overflow: hidden; }

/* Sidebar */
#sidebar { width: 195px; background: #0f172a; border-right: 1px solid #1e293b; overflow: hidden; flex-shrink: 0; transition: width 0.2s ease; display: flex; flex-direction: column; }
#sidebar.collapsed { width: 32px; }
#sidebar.disabled .sidebar-inner { opacity: 0.4; pointer-events: none; }
#sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 1px solid #1e293b; flex-shrink: 0; }
#sidebar-header .sidebar-label { font-size: 15px; text-transform: uppercase; color: #475569; letter-spacing: 0.05em; transition: opacity 0.2s ease; white-space: nowrap; overflow: hidden; }
#sidebar.collapsed #sidebar-header .sidebar-label { opacity: 0; pointer-events: none; }
#sidebar-toggle { background: none; border: 1px solid #334155; border-radius: 3px; color: #475569; cursor: pointer; width: 24px; height: 24px; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
#sidebar-toggle:hover { color: #e2e8f0; background: #1e293b; }
.sidebar-inner { flex: 1; min-height: 0; padding: 12px 8px; white-space: nowrap; overflow-y: auto; transition: visibility 0.2s ease, opacity 0.2s ease; }
#sidebar.collapsed .sidebar-inner { visibility: hidden; opacity: 0; }
.date-item { padding: 7px 8px; border-radius: 4px; font-size: 17px; cursor: pointer; color: #94a3b8; margin-bottom: 2px; }
.date-item:hover { background: #1e293b; color: #e2e8f0; }
.date-item.active { background: #1e40af; color: #fff; }
.date-group-header { display: flex; align-items: baseline; padding: 6px 8px; border-radius: 4px; border-left: 3px solid transparent; font-size: 15px; color: #cbd5e1; cursor: pointer; user-select: none; margin-bottom: 2px; }
.date-group-header:hover { background: #1e293b; }
.date-group-header.current { border-left-color: #1e40af; }
.date-group-arrow { width: 16px; flex-shrink: 0; color: #64748b; }
.date-group-count { color: #64748b; white-space: pre; }
.date-group-items { padding-left: 12px; }
.date-group.collapsed .date-group-items { display: none; }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#main-header { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; row-gap: 8px; padding: 12px 20px; background: #0f172a; border-bottom: 1px solid #1e293b; }
#main-content { flex: 1; overflow-y: auto; padding: 16px 20px 20px; }
#main-title { font-size: 18px; color: #94a3b8; }
#main-actions { display: flex; gap: 8px; }

/* Report card */
.report-card { background: #1e293b; border: 1px solid #334155; border-radius: 6px; margin-bottom: 10px; display: flex; overflow: hidden; }
.report-card.editing { border-color: #3b82f6; display: block; }
.form-container.report-card { display: block; padding: 14px; }
.card-body { padding: 14px; flex: 1; min-width: 0; }
@keyframes elastic-select {
  0%   { transform: scale(1); }
  30%  { transform: scale(0.92); }
  70%  { transform: scale(1.04); }
  100% { transform: scale(1); }
}
.select-zone {
  width: 44px;
  min-width: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-left: 1px solid #334155;
  cursor: pointer;
  background: #1e293b;
  color: #475569;
  font-size: 16px;
  user-select: none;
  transition: background 0.15s ease, color 0.15s ease;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  letter-spacing: 0.1em;
}
.select-zone:hover { background: #273549; color: #94a3b8; }
.select-zone.selected { background: #1e3a8a; color: #93c5fd; border-left-color: #3b82f6; }
.select-zone.animating { animation: elastic-select 0.28s ease; }
.report-fields { display: grid; grid-template-columns: minmax(140px, max-content) 1fr; column-gap: 12px; row-gap: 4px; font-size: 17px; margin-bottom: 10px; }
.field-label { color: #64748b; white-space: nowrap; }
.field-value { color: #e2e8f0; min-width: 0; overflow-wrap: anywhere; }
.field-input { width: 100%; padding: 6px 8px; background: #0f172a; border: 1px solid #334155; border-radius: 3px; color: #e2e8f0; font-size: 17px; }
.field-row { display: grid; grid-template-columns: 32px 20px 1fr 3fr; gap: 6px; align-items: center; margin-bottom: 4px; }
.field-row .btn-danger { padding: 3px 5px; font-size: 14px; }
.key-label { font-size: 17px; color: #cbd5e1; padding: 4px 8px; }
.drag-handle { cursor: grab; color: #475569; text-align: center; user-select: none; }
.card-actions { display: flex; gap: 6px; }
.edit-label { font-size: 15px; color: #3b82f6; margin-bottom: 8px; }
.report-card.editing .edit-label { text-align: center; padding: 10px 14px 6px; margin-bottom: 0; }
.report-card.editing .card-actions { justify-content: center; gap: 12px; }

/* Search results */
.search-date-tag { font-size: 15px; color: #3b82f6; margin-bottom: 4px; }
#no-results { text-align: center; color: #475569; padding: 40px; }
/* Toast */
#toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; pointer-events: none; }
.toast { padding: 10px 16px; border-radius: 4px; font-size: 17px; opacity: 1; transition: opacity 0.3s ease; white-space: nowrap; }
.toast-success { background: #065f46; color: #6ee7b7; border: 1px solid #10b981; }
.toast-error { background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; }
/* Drawer overlay */
#drawer-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.25s ease;
}
#drawer-overlay.open { opacity: 1; }

/* Schema drawer */
#schema-drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 38%;
  max-width: 50%;
  min-width: 280px;
  background: #1e293b;
  border-left: 1px solid #334155;
  z-index: 101;
  display: flex;
  flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  overflow: hidden;
}
#schema-drawer.open { transform: translateX(0); }
#schema-drawer-header {
  padding: 14px 16px;
  font-size: 17px;
  font-weight: 600;
  color: #94a3b8;
  border-bottom: 1px solid #334155;
  flex-shrink: 0;
}
#schema-drawer-content {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
}
#schema-drawer-footer {
  padding: 12px 16px;
  border-top: 1px solid #334155;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.drawer-tabs { display: flex; gap: 6px; margin-top: 8px; }
.drawer-tab { padding: 6px 12px; border-radius: 4px; font-size: 14px; cursor: pointer; color: #94a3b8; border: 1px solid #334155; }
.drawer-tab.active { background: #1e40af; color: #fff; border-color: #1e40af; }
/* Add modal */
#add-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(4px);
  opacity: 0;
  transition: opacity 0.2s ease;
}
#add-modal-overlay.open { opacity: 1; }
#add-modal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(1);
  width: 644px;
  max-width: 90vw;
  max-height: 85vh;
  overflow-y: auto;
  z-index: 201;
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 20px;
  opacity: 1;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
#add-modal.closing {
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.85);
}
@keyframes card-slide-in {
  from { opacity: 0; transform: translateX(60px); }
  to   { opacity: 1; transform: translateX(0); }
}
.card-slide-in { animation: card-slide-in 0.8s ease-out; }
#add-modal .card-actions { justify-content: center; gap: 20px; margin-top: 12px; }
#add-modal .card-actions .btn-sm { padding: 10px 32px; font-size: 17px; }
.template-toggle-bar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
.template-toggle-bar .btn-sm { font-size: 14px; padding: 6px 14px; }

/* Tab switcher */
#tab-switcher { display: flex; gap: 6px; }
.tab-btn { padding: 8px 16px; border: 1px solid #334155; border-radius: 4px; background: #1e293b; color: #94a3b8; cursor: pointer; font-size: 14px; }
.tab-btn:hover { background: #273549; color: #e2e8f0; }
.tab-btn.active { background: #1e40af; border-color: #1e40af; color: #fff; }

/* Main-header search row (relocated from topbar) */
#main-header-search { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* IP lookup page (filled in Task 9) */
/* body 是固定 100vh 的 flex 容器，分頁內容超出時文件本身不會捲動。
   事件管理分頁靠 #main-content 自行捲動，查詢分頁原本沒有對應設定——
   後處理視圖變長之後，超出視窗的內容會完全無法檢視。 */
#lookup-tab { flex: 1; min-height: 0; overflow-y: auto; }
#iplookup-root { padding: 16px 20px; }
.iplookup-bar { display: flex; gap: 8px; margin-bottom: 14px; }
.iplookup-bar input { flex: 1; max-width: 360px; padding: 8px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-size: 15px; }
.iplookup-tabs { display: flex; gap: 4px; border-bottom: 1px solid #334155; margin-bottom: 14px; }
.iplookup-tab-btn { padding: 8px 16px; border: none; background: none; color: #64748b; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; }
.iplookup-tab-btn.active { color: #e2e8f0; border-bottom-color: #3b82f6; }
.iplookup-tab-btn:disabled { color: #334155; cursor: not-allowed; }
.iplookup-panel { display: none; }
.iplookup-panel.active { display: block; }
.iplookup-meta { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
.iplookup-meta > div { display: flex; gap: 8px; }
.iplookup-empty, .iplookup-loading { color: #475569; padding: 30px; text-align: center; }
.iplookup-loading-analysis { color: #e2e8f0; font-weight: 600; }
.iplookup-settings-btn { margin-left: auto; }
#settings-overlay, #ip-stats-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 300; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 60px 16px; }
#settings-overlay.open, #ip-stats-overlay.open { display: flex; }
#settings-dialog, #ip-stats-dialog { background: #0f172a; border: 1px solid #334155; border-radius: 6px; width: 100%; max-width: 720px; }
#settings-dialog-header, #ip-stats-dialog-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #334155; color: #e2e8f0; font-weight: 600; }
.settings-wrap { max-width: 720px; margin: 0 auto; padding: 20px; }
.settings-card { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 14px 16px; margin-bottom: 14px; }
.settings-card h3 { margin: 0 0 8px; font-size: 15px; color: #e2e8f0; }
.settings-status { font-size: 14px; color: #94a3b8; margin-bottom: 10px; }
.settings-status.ok { color: #86efac; }
.settings-row { display: flex; gap: 8px; align-items: center; }
.settings-row input, .settings-row select { flex: 1; padding: 8px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-size: 14px; }
.settings-row input:disabled, .settings-row select:disabled, .settings-row button:disabled { opacity: .5; cursor: not-allowed; }
.settings-note { font-size: 13px; color: #64748b; margin-top: 8px; }
.settings-wrap > .settings-note:first-child { margin: 0 0 12px; }
.settings-msg { font-size: 13px; margin-top: 8px; color: #86efac; }
.settings-msg.err { color: #fca5a5; }
#main-title-wrap { display: flex; align-items: center; gap: 10px; }
#ip-stats-root { display: flex; gap: 16px; padding: 16px 20px; flex-wrap: wrap; }
.ip-stats-col { flex: 1; min-width: 240px; }
.ip-stats-col h3 { margin: 0 0 8px; font-size: 15px; color: #e2e8f0; }
.ip-stats-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 8px; border-bottom: 1px solid #1e293b; font-size: 14px; color: #cbd5e1; }
.ip-stats-row span:first-child { font-family: "Consolas", "Courier New", monospace; overflow-wrap: anywhere; }
.ip-stats-row.dup { color: #fbbf24; font-weight: 600; }
.ip-stats-empty { color: #475569; font-size: 14px; }
.iplookup-error { color: #fca5a5; background: #450a0a; border: 1px solid #7f1d1d; border-radius: 4px; padding: 12px; }
.iplookup-disclaimer { color: #fbbf24; font-size: 13px; margin-bottom: 10px; }
.iplookup-analysis-content { font-family: inherit; background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 12px 16px; font-size: 15px; line-height: 1.6; }
.iplookup-analysis-content p { margin: 0 0 10px; }
.iplookup-analysis-content .iplookup-md-h1 { font-size: 19px; color: #e2e8f0; font-weight: 600; margin: 0 0 12px; }
.iplookup-analysis-content .iplookup-md-h2 { font-size: 17px; color: #e2e8f0; font-weight: 600; margin: 18px 0 10px; }
.iplookup-analysis-content .iplookup-md-h3 { font-size: 15px; color: #94a3b8; font-weight: 600; margin: 14px 0 8px; }
.iplookup-analysis-content table { width: 100%; border-collapse: collapse; margin: 0 0 12px; font-size: 14px; }
.iplookup-analysis-content th, .iplookup-analysis-content td { border: 1px solid #334155; padding: 6px 10px; text-align: left; }
.iplookup-analysis-content th { background: #0f172a; color: #94a3b8; font-weight: 600; }
.iplookup-analysis-content ul { margin: 0 0 12px; padding-left: 22px; }
.iplookup-analysis-content li { margin-bottom: 6px; }
.iplookup-analysis-content blockquote { margin: 0 0 12px; padding: 6px 12px; border-left: 3px solid #3b82f6; color: #94a3b8; background: #0f172a; }
.iplookup-analysis-content hr { border: none; border-top: 1px solid #334155; margin: 14px 0; }
.iplookup-analysis-content code { font-family: "Consolas", "Courier New", monospace; background: #0f172a; border: 1px solid #334155; border-radius: 3px; padding: 1px 5px; font-size: 13px; color: #fbbf24; }
.iplookup-export { margin-top: 14px; display: flex; gap: 8px; }

/* 查詢結果後處理視圖 */
.iplookup-summary { background: #1e293b; border: 1px solid #334155; border-left: 3px solid #3b82f6; border-radius: 4px; padding: 12px 16px; margin-bottom: 14px; }
.iplookup-summary-title { font-size: 15px; font-weight: 600; color: #f8fafc; margin-bottom: 10px; }
.iplookup-summary-grid { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; column-gap: 14px; row-gap: 7px; font-size: 16px; align-items: baseline; }
.iplookup-sum-label { color: #64748b; white-space: nowrap; }
.iplookup-sum-value { color: #e2e8f0; min-width: 0; overflow-wrap: anywhere; }
.iplookup-sum-value.is-missing { color: #475569; font-style: italic; }
.iplookup-sum-note { font-size: 13px; color: #94a3b8; margin-top: 2px; line-height: 1.5; }
.tone-risk { color: #fca5a5; font-weight: 600; }
.tone-warn { color: #fbbf24; }
.tone-ok { color: #86efac; }
.iplookup-section { background: #1e293b; border: 1px solid #334155; border-radius: 4px; margin-bottom: 10px; }
.iplookup-section > summary { padding: 9px 14px; cursor: pointer; font-size: 15px; color: #e2e8f0; font-weight: 600; list-style-position: inside; }
.iplookup-section > summary:hover { background: #273549; }
.iplookup-section > *:not(summary) { margin: 0 14px 12px; }
.iplookup-section .report-fields { font-size: 15px; margin-bottom: 12px; }
.iplookup-sub { margin-top: 8px; }
.iplookup-sub > summary { cursor: pointer; color: #94a3b8; font-size: 14px; }
.iplookup-note { font-size: 13px; color: #94a3b8; line-height: 1.6; margin: 6px 14px 10px; white-space: pre-line; }
.iplookup-callout { font-size: 14px; line-height: 1.6; border-radius: 4px; padding: 8px 12px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; }
.iplookup-callout.tone-warn { border-color: #78350f; background: #1c1206; }
.iplookup-callout.tone-ok { border-color: #14532d; background: #041a0c; }
.iplookup-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.iplookup-chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: #0f172a; border: 1px solid #334155; color: #94a3b8; }
.iplookup-table-wrap { overflow-x: auto; }
.iplookup-table { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0; }
.iplookup-table th, .iplookup-table td { border: 1px solid #334155; padding: 5px 10px; text-align: left; vertical-align: top; }
.iplookup-table th { background: #0f172a; color: #94a3b8; font-weight: 600; white-space: nowrap; }
.iplookup-pre { font-family: "Consolas", "Courier New", monospace; font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; background: #0f172a; border: 1px solid #334155; border-radius: 4px; padding: 10px 12px; color: #cbd5e1; max-height: 420px; overflow-y: auto; }
</style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <span class="brand">SOC Toolkit</span>
  <div id="tab-switcher">
    <button id="tab-btn-reports" class="tab-btn active" onclick="switchAppTab('reports')">事件管理</button>
    <button id="tab-btn-lookup" class="tab-btn" onclick="switchAppTab('lookup')">IP查詢</button>
  </div>
</div>

<div id="reports-tab" class="app-tab">
  <div id="layout">
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <span class="sidebar-label">日期</span>
        <button id="sidebar-toggle" onclick="toggleSidebar()">‹</button>
      </div>
      <div class="sidebar-inner">
        <div id="date-list"></div>
      </div>
    </div>

    <!-- Main content -->
    <div id="main">
      <div id="main-header">
        <div id="main-title-wrap">
          <span id="main-title">載入中...</span>
          <button id="ip-stats-btn" class="btn btn-secondary btn-sm" style="display:none" onclick="openIpStats()">IP統計</button>
        </div>
        <div id="main-header-search">
          <input id="search-input" type="text" placeholder="搜尋 IP / Offense ID...">
          <span class="sep">日期區間</span>
          <input id="date-from" class="date-input" type="date">
          <span class="sep">～</span>
          <input id="date-to" class="date-input" type="date">
          <button class="btn btn-primary btn-sm" onclick="doSearch()">搜尋</button>
          <button id="clear-search-btn" class="btn btn-secondary btn-sm" style="display:none" onclick="clearSearch()">✕ 清除</button>
        </div>
        <div id="main-actions">
          <button class="btn btn-primary btn-sm" onclick="openAddForm()">＋ 新增通報</button>
          <button id="sort-btn" class="btn btn-secondary btn-sm" onclick="toggleSort()">排序↓</button>
          <button id="select-all-btn" class="btn btn-secondary btn-sm" onclick="toggleSelectAll()">全選</button>
          <button id="copy-selected-btn" class="btn btn-success btn-sm" onclick="copySelected()" disabled>複製選取事件</button>
          <button class="btn btn-secondary btn-sm" onclick="openSchemaDrawer()">欄位管理</button>
        </div>
      </div>
      <div id="main-content">
        <div id="reports-container"></div>
      </div>
    </div>
  </div>
</div>

<div id="lookup-tab" class="app-tab" style="display:none">
  <div id="iplookup-root"></div>
</div>

<!-- IP 查詢的金鑰／模型設定；只從 IP 查詢頁開啟 -->
<div id="settings-overlay" onclick="if (event.target === this) closeSettings()">
  <div id="settings-dialog" role="dialog" aria-label="IP 查詢設定">
    <div id="settings-dialog-header">
      IP 查詢設定
      <button class="btn btn-secondary btn-sm" onclick="closeSettings()">✕ 關閉</button>
    </div>
    <div id="settings-root"></div>
  </div>
</div>

<div id="ip-stats-overlay" onclick="if (event.target === this) closeIpStats()">
  <div id="ip-stats-dialog" role="dialog" aria-label="IP 統計">
    <div id="ip-stats-dialog-header">
      <span id="ip-stats-title"></span>
      <button class="btn btn-secondary btn-sm" onclick="closeIpStats()">✕ 關閉</button>
    </div>
    <div id="ip-stats-root"></div>
  </div>
</div>

<script>
let currentDate = null;
let currentReports = [];
let schemaByTemplate = { general: [], waf: [] };
let isSearchMode = false;
let sortOrder = 'desc';
// 每次切換主畫面（選日期／搜尋）遞增；較晚發出的請求才有資格寫入畫面
let viewSeq = 0;

function switchAppTab(tab) {
  document.getElementById('reports-tab').style.display = tab === 'reports' ? '' : 'none';
  document.getElementById('lookup-tab').style.display = tab === 'lookup' ? '' : 'none';
  document.getElementById('tab-btn-reports').classList.toggle('active', tab === 'reports');
  document.getElementById('tab-btn-lookup').classList.toggle('active', tab === 'lookup');
}

function openSettings() {
  document.getElementById('settings-overlay').classList.add('open');
  if (window.settingsRefresh) window.settingsRefresh();
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('settings-overlay').classList.contains('open')) closeSettings();
  if (e.key === 'Escape') closeIpStats();
});

// 回傳 [[顯示值, 次數], ...]，次數多的在前；空值不計。
// 一個欄位可用「/」分隔多個 IP；去掉中括號後相同就算同一個（8.8[.]8.8、8[.]8.8.8、8.8.8.8）。
// 顯示值優先用第一個帶中括號的寫法，避免從視窗複製出未 defang 的 IP
function countField(reports, key) {
  const counts = new Map();
  reports.forEach(r => {
    String(r.fields[key] ?? '').split('/').forEach(part => {
      const raw = part.trim();
      const ip = raw.replace(/[\[\]]/g, '').trim();
      if (!ip) return;
      const entry = counts.get(ip) || { label: raw, n: 0 };
      if (!entry.label.includes('[') && raw.includes('[')) entry.label = raw;
      entry.n++;
      counts.set(ip, entry);
    });
  });
  return [...counts.values()].map(e => [e.label, e.n]).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}

// 統計目前所選日期已載入的通報（currentReports），開啟當下即時計算，編輯／刪除後也正確
function openIpStats() {
  document.getElementById('ip-stats-title').textContent = `${currentDate} IP 統計（${currentReports.length} 筆通報）`;
  document.getElementById('ip-stats-root').replaceChildren(...['來源IP', '目的IP'].map(key => {
    const rows = countField(currentReports, key);
    const col = document.createElement('div');
    col.className = 'ip-stats-col';
    const h = document.createElement('h3');
    h.textContent = `${key}（${rows.length} 個）`;
    col.appendChild(h);
    if (!rows.length) {
      const empty = document.createElement('div');
      empty.className = 'ip-stats-empty';
      empty.textContent = '無資料';
      col.appendChild(empty);
    }
    // 值可能是 WAF payload 原文，一律走 textContent
    rows.forEach(([ip, n]) => {
      const row = document.createElement('div');
      row.className = 'ip-stats-row' + (n > 1 ? ' dup' : '');
      const ipEl = document.createElement('span');
      ipEl.textContent = ip;
      const nEl = document.createElement('span');
      nEl.textContent = `${n} 次`;
      row.append(ipEl, nEl);
      col.appendChild(row);
    });
    return col;
  }));
  document.getElementById('ip-stats-overlay').classList.add('open');
}

function closeIpStats() {
  document.getElementById('ip-stats-overlay').classList.remove('open');
}

// 本地日期（不是 UTC）；每次即時取值，頁面開著跨過午夜也正確
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  if (!r.ok) {
    // body 只能讀一次：先取文字再嘗試解析，避免 json() 失敗後 text() 拋 "body used already"
    const raw = await r.text();
    let msg = raw || `${r.status} ${r.statusText}`;
    try {
      const err = JSON.parse(raw);
      if (typeof err.detail === 'string') {
        msg = err.detail;
      } else if (Array.isArray(err.detail)) {
        // FastAPI 422：detail 是驗證錯誤陣列，只取人看得懂的 msg
        msg = err.detail.map(d => String(d.msg ?? JSON.stringify(d)).replace(/^Value error, /, '')).join('；');
      } else if (err.detail !== undefined) {
        msg = JSON.stringify(err.detail);
      }
    } catch {}
    throw new Error(msg);
  }
  return r.json();
}

// 日期依 YYYY-MM 分組：組由新到舊、組內日期由新到舊
function groupDatesByMonth(dates) {
  const groups = new Map();
  [...dates].sort().reverse().forEach(d => {
    const ym = dateYm(d);
    if (!groups.has(ym)) groups.set(ym, { ym, label: ymLabel(ym), dates: [] });
    groups.get(ym).dates.push(d);
  });
  return [...groups.values()].sort((a, b) => (a.ym < b.ym ? 1 : a.ym > b.ym ? -1 : 0));
}

function dateYm(date) {
  return String(date).slice(0, 7);
}

function ymLabel(ym) {
  const m = /^(\d{4})-(\d{2})$/.exec(ym);
  return m ? `${m[1]}年${Number(m[2])}月` : ym;
}

// 已展開的 YYYY-MM；存在 localStorage，讀寫失敗時只留在記憶體
const DATE_GROUPS_KEY = 'dateGroupsExpanded';
const expandedGroups = loadExpandedGroups();

function loadExpandedGroups() {
  try {
    const saved = JSON.parse(localStorage.getItem(DATE_GROUPS_KEY));
    if (Array.isArray(saved)) return new Set(saved.filter(v => typeof v === 'string'));
  } catch {}
  return new Set();
}

function saveExpandedGroups() {
  try {
    localStorage.setItem(DATE_GROUPS_KEY, JSON.stringify([...expandedGroups]));
  } catch {}
}

function setGroupExpanded(group, expanded) {
  group.classList.toggle('collapsed', !expanded);
  group.querySelector('.date-group-arrow').textContent = expanded ? '▾' : '▸';
}

function toggleDateGroup(group) {
  const ym = group.dataset.ym;
  const expanded = !expandedGroups.has(ym);
  if (expanded) expandedGroups.add(ym);
  else expandedGroups.delete(ym);
  saveExpandedGroups();
  setGroupExpanded(group, expanded);
}

function buildDateItem(date, text) {
  const item = document.createElement('div');
  item.className = 'date-item';
  item.dataset.date = date;
  item.textContent = text;
  item.onclick = () => selectDate(date);
  return item;
}

// 只在 init、新增成功、刪除成功後呼叫；選日期只切換標示（markActiveDate）
async function loadDates() {
  let dates;
  try {
    dates = await api('GET', '/api/dates');
  } catch (e) {
    showToast(`日期列表載入失敗：${e.message}`, 'error');
    return;
  }
  const today = todayStr();
  const groups = groupDatesByMonth(dates);
  if (!dates.includes(today) && !groups.some(g => g.ym === dateYm(today))) {
    groups.push({ ym: dateYm(today), label: ymLabel(dateYm(today)), dates: [] });
    groups.sort((a, b) => (a.ym < b.ym ? 1 : a.ym > b.ym ? -1 : 0));
  }

  const list = document.getElementById('date-list');
  list.innerHTML = '';
  groups.forEach(g => {
    const group = document.createElement('div');
    group.className = 'date-group';
    group.dataset.ym = g.ym;

    const header = document.createElement('div');
    header.className = 'date-group-header';
    const arrow = document.createElement('span');
    arrow.className = 'date-group-arrow';
    const label = document.createElement('span');
    label.textContent = g.label;
    const count = document.createElement('span');
    count.className = 'date-group-count';
    count.textContent = ` (${g.dates.length})`;
    header.append(arrow, label, count);
    header.onclick = () => toggleDateGroup(group);

    const items = document.createElement('div');
    items.className = 'date-group-items';
    // 「今天 ●」佔位項目放在今天所屬月份的最上方，不計入組計數
    if (g.ym === dateYm(today) && !dates.includes(today)) items.appendChild(buildDateItem(today, today + ' ●'));
    g.dates.forEach(d => items.appendChild(buildDateItem(d, d)));

    group.append(header, items);
    setGroupExpanded(group, expandedGroups.has(g.ym));
    list.appendChild(group);
  });
  markActiveDate();
}

// 標示 currentDate，並確保它所在的組是展開的（使用者手動收合的其他組不動）
function markActiveDate() {
  const list = document.getElementById('date-list');
  list.querySelectorAll('.date-item.active').forEach(el => el.classList.remove('active'));
  list.querySelectorAll('.date-group-header.current').forEach(el => el.classList.remove('current'));
  if (!currentDate) return;
  const item = [...list.querySelectorAll('.date-item')].find(el => el.dataset.date === currentDate);
  if (!item) return;
  item.classList.add('active');
  const group = item.closest('.date-group');
  group.querySelector('.date-group-header').classList.add('current');
  if (!expandedGroups.has(group.dataset.ym)) {
    expandedGroups.add(group.dataset.ym);
    saveExpandedGroups();
  }
  setGroupExpanded(group, true);
}

let searchLabel = '';

function updateMainTitle() {
  const n = document.querySelectorAll('#reports-container > .report-card').length;
  document.getElementById('main-title').textContent = isSearchMode
    ? `${searchLabel} — ${n} 筆結果`
    : `${currentDate}　${n} 筆通報`;
}

function showInitError(message) {
  document.getElementById('main-title').textContent = `載入失敗：${message}`;
  const container = document.getElementById('reports-container');
  container.innerHTML = '<div id="no-results"><button class="btn btn-primary btn-sm">重試</button></div>';
  container.querySelector('button').onclick = init;
}

async function selectDate(date) {
  const seq = ++viewSeq;
  let reports;
  try {
    reports = await api('GET', `/api/reports?${new URLSearchParams({ date })}`);
  } catch (e) {
    if (seq !== viewSeq) return;
    showToast(`載入失敗：${e.message}`, 'error');
    if (!currentDate) showInitError(e.message);
    return;
  }
  if (seq !== viewSeq) return;
  currentDate = date;
  isSearchMode = false;
  document.getElementById('sidebar').classList.remove('disabled');
  document.getElementById('clear-search-btn').style.display = 'none';
  document.getElementById('select-all-btn').style.display = '';
  document.getElementById('copy-selected-btn').style.display = '';
  document.getElementById('ip-stats-btn').style.display = '';
  currentReports = reports;
  renderReports(reports);
  updateMainTitle();
  markActiveDate();
}

async function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  const dateFrom = document.getElementById('date-from').value;
  const dateTo = document.getElementById('date-to').value;

  if (!q && !dateFrom && !dateTo) {
    showToast('請輸入搜尋條件', 'error');
    return;
  }

  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (dateFrom) params.set('date_from', dateFrom);
  if (dateTo) params.set('date_to', dateTo);

  const seq = ++viewSeq;
  let data;
  try {
    data = await api('GET', `/api/search?${params}`);
  } catch (e) {
    if (seq === viewSeq) showToast(`搜尋失敗：${e.message}`, 'error');
    return;
  }
  if (seq !== viewSeq) return;
  isSearchMode = true;
  document.getElementById('sidebar').classList.add('disabled');
  document.getElementById('clear-search-btn').style.display = '';
  document.getElementById('select-all-btn').style.display = 'none';
  document.getElementById('copy-selected-btn').style.display = 'none';
  document.getElementById('ip-stats-btn').style.display = 'none';
  searchLabel = q ? `搜尋「${q}」` : '日期區間搜尋';
  renderReports(data.reports, true);
  updateMainTitle();
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('date-from').value = '';
  document.getElementById('date-to').value = '';
  selectDate(currentDate);
}

let schemaDrawerTemplate = 'general';
// 抽屜只改這份草稿，儲存成功才寫回 schemaByTemplate；取消即丟棄
let schemaDraft = null;

function openSchemaDrawer() {
  schemaDrawerTemplate = 'general';
  schemaDraft = structuredClone(schemaByTemplate);
  renderSchemaDrawerTabs();
  renderSchemaPanel();
  const overlay = document.getElementById('drawer-overlay');
  const drawer = document.getElementById('schema-drawer');
  overlay.style.display = 'block';
  requestAnimationFrame(() => {
    overlay.classList.add('open');
    drawer.classList.add('open');
  });
}

function closeSchemaDrawer() {
  const overlay = document.getElementById('drawer-overlay');
  const drawer = document.getElementById('schema-drawer');
  overlay.classList.remove('open');
  drawer.classList.remove('open');
  drawer.addEventListener('transitionend', () => {
    if (!drawer.classList.contains('open')) overlay.style.display = 'none';
  }, { once: true });
}

function renderSchemaDrawerTabs() {
  const tabs = document.getElementById('schema-drawer-tabs');
  tabs.innerHTML = '';
  Object.entries(TEMPLATE_LABELS).forEach(([key, label]) => {
    const tab = document.createElement('div');
    tab.className = 'drawer-tab' + (key === schemaDrawerTemplate ? ' active' : '');
    tab.textContent = label;
    tab.onclick = () => switchSchemaDrawerTemplate(key);
    tabs.appendChild(tab);
  });
}

function makeButton(className, text, onClick) {
  const btn = document.createElement('button');
  btn.className = className;
  btn.textContent = text;
  btn.onclick = onClick;
  return btn;
}

function switchSchemaDrawerTemplate(template) {
  schemaDrawerTemplate = template;
  renderSchemaDrawerTabs();
  renderSchemaPanel();
}

function renderSchemaPanel() {
  const panel = document.getElementById('schema-drawer-content');
  const fields = schemaDraft[schemaDrawerTemplate];
  panel.innerHTML = '';
  const rows = document.createElement('div');
  fields.forEach((f, i) => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px';
    const input = document.createElement('input');
    input.className = 'field-input';
    input.style.flex = '1';
    input.value = f;
    input.oninput = () => { fields[i] = input.value; };
    // Offense ID 是後端必保留的欄位（models.REQUIRED_SCHEMA_FIELDS）：不可改名、不可刪除
    const locked = f === 'Offense ID';
    if (locked) { input.readOnly = true; input.title = '必要欄位，不可修改或刪除'; }
    row.append(
      input,
      makeButton('btn btn-secondary btn-sm', '↑', () => schemaRowUp(i)),
      locked
        ? makeButton('btn btn-danger btn-sm', '✕', () => {})
        : makeButton('btn btn-danger btn-sm', '✕', () => { fields.splice(i, 1); renderSchemaPanel(); })
    );
    if (locked) { const del = row.lastChild; del.disabled = true; del.title = '必要欄位，不可刪除'; }
    rows.appendChild(row);
  });
  const addRow = document.createElement('div');
  addRow.style.cssText = 'display:flex;gap:8px;margin-top:8px';
  addRow.innerHTML = '<input id="new-field-input" class="field-input" placeholder="新欄位名稱" style="flex:1">';
  addRow.appendChild(makeButton('btn btn-success btn-sm', '＋ 新增', addSchemaField));
  panel.append(rows, addRow);
}

function schemaRowUp(i) {
  if (i === 0) return;
  const arr = schemaDraft[schemaDrawerTemplate];
  [arr[i-1], arr[i]] = [arr[i], arr[i-1]];
  renderSchemaPanel();
}

function addSchemaField() {
  const input = document.getElementById('new-field-input');
  const val = input.value.trim();
  if (!val) return;
  schemaDraft[schemaDrawerTemplate].push(val);
  input.value = '';
  renderSchemaPanel();
}

async function saveSchema() {
  const btn = document.getElementById('schema-save-btn');
  if (btn.disabled) return;
  btn.disabled = true;
  const template = schemaDrawerTemplate;
  try {
    const res = await api('PUT', `/api/schema?${new URLSearchParams({ template })}`, { fields: schemaDraft[template] });
    schemaByTemplate[template] = res.fields;
    schemaDraft[template] = [...res.fields];
    showToast('欄位已儲存');
    closeSchemaDrawer();
  } catch (e) {
    showToast(`儲存失敗：${e.message}`, 'error');
  } finally {
    btn.disabled = false;
  }
}

async function init() {
  document.getElementById('main-title').textContent = '載入中...';
  try {
    const [general, waf] = await Promise.all([
      api('GET', '/api/schema?template=general'),
      api('GET', '/api/schema?template=waf'),
    ]);
    schemaByTemplate.general = general.fields;
    schemaByTemplate.waf = waf.fields;
  } catch (e) {
    showToast(`載入失敗：${e.message}`, 'error');
    showInitError(e.message);
    return;
  }
  await loadDates();
  await selectDate(todayStr());
}

function sortedReports(reports) {
  return [...reports].sort((a, b) => sortOrder === 'desc' ? b.id - a.id : a.id - b.id);
}

function toggleSort() {
  sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
  document.getElementById('sort-btn').textContent = sortOrder === 'desc' ? '排序↓' : '排序↑';
  if (isSearchMode) {
    const container = document.getElementById('reports-container');
    const sorted = sortedReports(Array.from(container.querySelectorAll(':scope > .report-card')).map(c => c._report));
    sorted.forEach(r => {
      const card = document.getElementById(`card-${r.id}`);
      container.appendChild(card);
    });
  } else {
    renderReports(currentReports);
  }
}

function renderReports(reports, searchMode = false) {
  const container = document.getElementById('reports-container');
  container.innerHTML = '';
  const copyBtn = document.getElementById('copy-selected-btn');
  if (copyBtn) copyBtn.disabled = true;
  if (reports.length === 0) {
    container.innerHTML = '<div id="no-results">無通報紀錄</div>';
    return;
  }
  sortedReports(reports).forEach(r => container.appendChild(buildCard(r, searchMode)));
}

function buildCard(report, showDate = false) {
  const card = document.createElement('div');
  card.className = 'report-card';
  card.id = `card-${report.id}`;

  // 欄位名與值常是 WAF payload 原文，一律走 textContent
  const body = document.createElement('div');
  body.className = 'card-body';
  if (showDate) {
    const tag = document.createElement('div');
    tag.className = 'search-date-tag';
    tag.textContent = report.date;
    body.appendChild(tag);
  }
  const fieldsEl = document.createElement('div');
  fieldsEl.className = 'report-fields';
  report.field_order.forEach(k => {
    const label = document.createElement('span');
    label.className = 'field-label';
    label.textContent = k;
    const value = document.createElement('span');
    value.className = 'field-value';
    value.textContent = report.fields[k] ?? '';
    fieldsEl.append(label, value);
  });
  const actions = document.createElement('div');
  actions.className = 'card-actions';
  actions.append(
    makeButton('btn btn-secondary btn-sm', '複製', () => copyReport(report.id)),
    makeButton('btn btn-secondary btn-sm', '編輯', () => editReport(report.id)),
    makeButton('btn btn-danger btn-sm', '刪除', () => deleteReport(report.id))
  );
  body.append(fieldsEl, actions);
  card.appendChild(body);

  if (!showDate) {
    const zone = document.createElement('div');
    zone.className = 'select-zone';
    zone.textContent = '選取';
    zone.dataset.id = report.id;
    zone.onclick = () => toggleSelectZone(zone);
    card.appendChild(zone);
  }

  card._report = report;
  card._showDate = showDate;
  return card;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    showToast('已成功複製');
  } catch (e) {
    showToast(`複製失敗：${e.message}`, 'error');
  }
}

function formatReport(report) {
  return report.field_order.map(k => `- ${k}：${report.fields[k] ?? ''}`).join('\n');
}

async function copyReport(id) {
  const card = document.getElementById(`card-${id}`);
  await copyText(formatReport(card._report));
}

function toggleSelectZone(zone) {
  zone.classList.toggle('selected');
  zone.classList.add('animating');
  zone.addEventListener('animationend', () => zone.classList.remove('animating'), { once: true });
  updateCopyBtn();
}

function updateCopyBtn() {
  const any = document.querySelectorAll('.select-zone.selected').length > 0;
  document.getElementById('copy-selected-btn').disabled = !any;
}

function toggleSelectAll() {
  const zones = Array.from(document.querySelectorAll('.select-zone'));
  const allSelected = zones.length > 0 && zones.every(z => z.classList.contains('selected'));
  zones.forEach(z => z.classList.toggle('selected', !allSelected));
  updateCopyBtn();
}

async function copySelected() {
  const selected = Array.from(document.querySelectorAll('.select-zone.selected'));
  if (!selected.length) return;
  const ids = new Set(selected.map(z => parseInt(z.dataset.id)));
  const reports = currentReports.filter(r => ids.has(r.id));
  const text = reports.map(r => formatReport(r)).join('\n\n\n');
  await copyText(text);
}

// 卡片增減後同步標題、空狀態與複製鈕（不重抓整個日期，搜尋模式也不會被踢出）
function refreshReportsMeta() {
  const container = document.getElementById('reports-container');
  if (!container.querySelector(':scope > .report-card')) {
    container.innerHTML = '<div id="no-results">無通報紀錄</div>';
  }
  updateMainTitle();
  updateCopyBtn();
}

async function deleteReport(id) {
  if (!confirm('確定要刪除這筆通報嗎？')) return;
  try {
    await api('DELETE', `/api/reports/${id}`);
  } catch (e) {
    showToast(`刪除失敗：${e.message}`, 'error');
    return;
  }
  currentReports = currentReports.filter(r => r.id !== id);
  document.getElementById(`card-${id}`)?.remove();
  refreshReportsMeta();
  showToast('已刪除');
  await loadDates();
}

function buildFieldRow(k, value, isDefault) {
  const row = document.createElement('div');
  row.className = 'field-row';
  row.dataset.key = k;
  row.innerHTML = `
    <button class="btn btn-danger btn-sm" onclick="deleteFieldRow(this)">✕</button>
    <span class="drag-handle" draggable="true">⠿</span>`;
  if (isDefault) {
    const label = document.createElement('span');
    label.className = 'key-label';
    label.textContent = k;
    row.appendChild(label);
  } else {
    const keyInput = document.createElement('input');
    keyInput.className = 'field-input key-input';
    keyInput.placeholder = '欄位名稱';
    keyInput.value = k;
    row.appendChild(keyInput);
  }
  const valInput = document.createElement('input');
  valInput.className = 'field-input val-input';
  valInput.placeholder = '值';
  valInput.value = value;
  row.appendChild(valInput);
  return row;
}

function buildFieldRows(fields, order, defaultKeys = []) {
  return order.map(k => buildFieldRow(k, fields[k] ?? '', defaultKeys.includes(k)));
}

function addFieldRow(container) {
  container.querySelector('.field-rows').appendChild(buildFieldRow('', '', false));
  bindDrag(container);
}

// 欄位名重複時提示並回傳 null（否則後者會蓋掉前者，field_order 卻記兩次）
function collectFormData(container) {
  const rows = container.querySelectorAll('.field-row');
  const fields = {}, order = [];
  let duplicate = null;
  rows.forEach(r => {
    const keyInput = r.querySelector('.key-input');
    const keyLabel = r.querySelector('.key-label');
    const k = keyInput ? keyInput.value.trim() : (keyLabel ? keyLabel.textContent.trim() : '');
    const v = r.querySelector('.val-input').value.trim();
    if (!k) return;
    if (order.includes(k)) { duplicate ??= k; return; }
    fields[k] = v;
    order.push(k);
  });
  if (duplicate !== null) {
    showToast(`欄位名稱重複：${duplicate}`, 'error');
    return null;
  }
  return { fields, field_order: order };
}

function deleteFieldRow(btn) {
  btn.closest('.field-row').remove();
}

function bindDrag(container) {
  const rows = container.querySelectorAll('.field-row');
  rows.forEach(row => {
    row.querySelector('.drag-handle').ondragstart = e => {
      e.dataTransfer.effectAllowed = 'move';
      container._dragging = row;
    };
    row.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
    row.ondrop = e => {
      e.preventDefault();
      const dragging = container._dragging;
      if (dragging && dragging !== row) {
        row.parentNode.insertBefore(dragging, row);
      }
    };
  });
}

function buildForm(fields, order, onSave, onCancel, defaultKeys = []) {
  const div = document.createElement('div');
  div.className = 'form-container report-card';
  div.innerHTML = `
    <div class="field-rows"></div>
    <button class="btn btn-success btn-sm" style="margin-bottom:12px" onclick="addFieldRow(this.closest('.form-container'))">＋ 新增欄位</button>
    <div class="card-actions">
      <button class="btn btn-primary btn-sm save-btn">儲存</button>
      <button class="btn btn-secondary btn-sm cancel-btn">取消</button>
    </div>`;
  div.querySelector('.field-rows').append(...buildFieldRows(fields, order, defaultKeys));
  // 儲存期間鎖住按鈕，避免連點送出兩次
  const saveBtn = div.querySelector('.save-btn');
  saveBtn.onclick = async () => {
    if (saveBtn.disabled) return;
    saveBtn.disabled = true;
    try {
      await onSave(div);
    } finally {
      saveBtn.disabled = false;
    }
  };
  div.querySelector('.cancel-btn').onclick = onCancel;
  bindDrag(div);
  return div;
}

// 關閉動畫的 transitionend 監聽器會在重開後才觸發；用序號讓過期的監聽器失效
let addModalCloseGen = 0;

function closeAddModal() {
  const overlay = document.getElementById('add-modal-overlay');
  const modal = document.getElementById('add-modal');
  if (modal.classList.contains('closing')) return;
  const gen = ++addModalCloseGen;
  modal.classList.add('closing');
  overlay.classList.remove('open');
  modal.addEventListener('transitionend', () => {
    if (gen !== addModalCloseGen) return;
    overlay.style.display = 'none';
    modal.style.display = 'none';
    modal.classList.remove('closing');
    modal.innerHTML = '';
  }, { once: true });
}

function handleModalOverlayClick(e) {
  if (e.target === e.currentTarget) closeAddModal();
}

const TEMPLATE_LABELS = { general: '一般事件', waf: 'WAF事件' };
let currentAddTemplate = 'general';

function renderAddForm(template) {
  currentAddTemplate = template;
  const modal = document.getElementById('add-modal');
  modal.innerHTML = '';

  const toggleBar = document.createElement('div');
  toggleBar.className = 'template-toggle-bar';
  const otherTemplate = template === 'general' ? 'waf' : 'general';
  toggleBar.innerHTML = `<button class="btn btn-secondary btn-sm" onclick="renderAddForm('${otherTemplate}')">${TEMPLATE_LABELS[template]}</button>`;
  modal.appendChild(toggleBar);

  const now = new Date();
  const dateStr = `${now.getMonth() + 1}月${now.getDate()}日`;
  const schemaFields = schemaByTemplate[template];
  const initFields = Object.fromEntries(
    schemaFields.map(k => [k, k === '時間' ? dateStr : ''])
  );
  const form = buildForm(
    initFields,
    schemaFields,
    async (div) => {
      const data = collectFormData(div);
      if (!data) return;
      let created;
      try {
        created = await api('POST', '/api/reports', { date: currentDate, ...data });
      } catch (e) {
        showToast(`儲存失敗：${e.message}`, 'error');
        return;
      }
      closeAddModal();
      showToast('已成功儲存');
      await loadDates();
      await selectDate(currentDate);
      document.getElementById(`card-${created.id}`)?.classList.add('card-slide-in');
    },
    closeAddModal,
    schemaFields
  );
  modal.appendChild(form);
}

function openAddForm() {
  const overlay = document.getElementById('add-modal-overlay');
  const modal = document.getElementById('add-modal');
  addModalCloseGen++;
  modal.classList.remove('closing');
  renderAddForm('general');
  overlay.style.display = 'block';
  modal.style.display = 'block';
  requestAnimationFrame(() => overlay.classList.add('open'));
}

// 取消／儲存都只原地替換這張卡片，不重抓日期，搜尋結果也保留
function restoreCard(card, report) {
  card.replaceWith(buildCard(report, card._showDate));
  updateCopyBtn();
}

function editReport(id) {
  // 一次只允許一張卡片在編輯，避免另一張未存的修改被默默丟掉
  const editing = document.querySelector('#reports-container > .report-card.editing');
  if (editing) {
    if (editing.id === `card-${id}`) return;
    if (!confirm('另一筆通報正在編輯，要放棄它未儲存的修改嗎？')) return;
    restoreCard(editing, editing._report);
  }
  const card = document.getElementById(`card-${id}`);
  const report = card._report;
  card.classList.add('editing');
  card.innerHTML = '<div class="edit-label">編輯中</div>';
  const form = buildForm(
    report.fields,
    report.field_order,
    async (div) => {
      const data = collectFormData(div);
      if (!data) return;
      let updated;
      try {
        updated = await api('PUT', `/api/reports/${id}`, data);
      } catch (e) {
        showToast(`儲存失敗：${e.message}`, 'error');
        return;
      }
      currentReports = currentReports.map(r => (r.id === id ? updated : r));
      restoreCard(card, updated);
      showToast('已成功儲存');
    },
    () => restoreCard(card, report)
  );
  card.appendChild(form);
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
  const collapsed = sidebar.classList.contains('collapsed');
  document.getElementById('sidebar-toggle').textContent = collapsed ? '›' : '‹';
  document.getElementById('sidebar-toggle').title = collapsed ? '展開側邊欄' : '收合側邊欄';
}

document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

// toast 容器與抽屜在 script 之後才出現；等 DOM 解析完再啟動，init 立刻失敗時才有地方顯示錯誤
document.addEventListener('DOMContentLoaded', init);
